---
name: Release

on:
  push:
    tags:
      - "*" # triggers only if push new tag version
  workflow_dispatch:

defaults:
  run:
    shell: nix develop --fallback --command bash -e {0}

permissions:
  contents: write # Required for creating releases and uploading artifacts
  packages: write # Required for pushing to GHCR

jobs:
  release:
    name: Build and Release
    if: github.repository == 'blackhiden/headscale'
    runs-on: ubuntu-latest
    permissions:
      # The GitHub release.
      contents: write
      # ko pushes to ghcr.io.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Required for GoReleaser to generate changelog

      - name: Install Nix
        uses: NixOS/nix-installer-action@v1.0.0

      - name: Setup Nix caching
        uses: Mic92/hestia@v3.1.0

      - name: Login to DockerHub
        uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 7
